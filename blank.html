<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Rock Paper Scissors</title>
    <style>
        body {
            font-family: Arial, sans-serif;
            text-align: center;
            padding-top: 50px;
            background: #f0f0f0;
        }
        button {
            padding: 10px 20px;
            margin: 10px;
            font-size: 18px;
            cursor: pointer;
        }
        #result, #score {
            margin-top: 25px;
            font-size: 22px;
            font-weight: bold;
        }
        #winner {
            margin-top: 35px;
            font-size: 26px;
            font-weight: bold;
            color: green;
            
        }
        #retry button {
            text-align: center;
            margin-top: 30px;
            padding: 10px 25px;
            font-size: 20px;
            border-radius: 8px;
            
}
        
    </style>
</head>
<body>

    <h1>Rock Paper Scissors</h1>
    <div id="selection"></div>

    <div id="result"></div>
    <div id="score"></div>
    <div id="winner"></div>
    <div id="retry"></div>

    <script src="rockpaperscissors.js"></script>
</body>
</html>
